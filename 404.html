<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Página não encontrada | João Gabriel Torre</title>
  <meta name="robots" content="noindex" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <link rel="icon" href="assets/images/icons/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="assets/css/variables.css" />
  <link rel="stylesheet" href="assets/css/reset.css" />

  <style>
    body {
      background: var(--color-bg);
      color: var(--color-text);
      font-family: var(--font-body);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: var(--space-4);
      gap: var(--space-2);
    }
    .code {
      font-family: var(--font-mono);
      color: var(--color-accent);
      font-size: var(--fs-body-sm);
      letter-spacing: 0.1em;
    }
    h1 {
      font-family: var(--font-display);
      font-size: clamp(2.5rem, 8vw, 4.5rem);
      font-weight: 700;
      background: var(--gradient-primary);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    p {
      color: var(--color-text-secondary);
      max-width: 40ch;
    }
    a {
      margin-top: var(--space-2);
      display: inline-flex;
      padding: 0.85rem 1.75rem;
      border-radius: var(--radius-full);
      background: var(--gradient-primary);
      color: var(--color-text);
      text-decoration: none;
      font-size: var(--fs-body-sm);
      font-weight: 600;
      transition: transform var(--transition-fast);
    }
    a:hover {
      transform: translateY(-2px);
    }
  </style>
</head>
<body>
  <span class="code">ERRO // 404</span>
  <h1>Página não encontrada</h1>
  <p>O dado que você buscou não existe nesta base — mas o resto do portfólio está de pé.</p>
  <a href="/">Voltar para o início</a>
</body>
</html>
